<div class="flex justify-start gap-6 p-4 max-w-fit mx-auto animate-pulse">

  <div class="flex flex-col gap-4 mt-4 w-fit">
    @for (i of [1, 2]; track i) {
    <div class="w-280 h-40 flex justify-between bg-gray-200 rounded-lg p-5">

      <div class="w-30 h-30 bg-gray-300 rounded-md shrink-0"></div>

      <div class="flex flex-col gap-3 w-200 px-4">
        <div class="h-5 w-40 bg-gray-300 rounded"></div>
        <div class="h-4 w-24 bg-gray-300 rounded"></div>
      </div>

      <div class="flex flex-col gap-2 items-end text-lg justify-between shrink-0">
        <div class="h-5 w-16 bg-gray-300 rounded"></div>
        <div class="h-8 w-24 bg-gray-300 rounded-full"></div>
        <div class="h-4 w-12 bg-gray-300 rounded"></div>
      </div>

    </div>
    }
  </div>

  <div class="flex flex-col gap-4 mt-4 p-4 bg-gray-200 rounded-lg w-[300px] h-fit shrink-0">
    <div class="h-8 w-40 bg-gray-300 rounded mb-2"></div>

    <div class="w-[270px] h-[120px] bg-gray-300 rounded-lg"></div>
  </div>

</div>
