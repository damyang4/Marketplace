@if (token()) {
  <div class="mt-12 px-12 mb-14">
    <form class="max-w-125 m-auto" (submit)="$event.preventDefault(); onSubmit()">
      <h1 class="text-4xl font-semibold mb-6">Add a product</h1>
      <div class="mb-10">
        <div class="mb-5">
          <label for="name" class="block text-[13px] font-semibold mb-1.5">Name </label>
          <input
            type="text"
            id="name"
            [formField]="productForm.name"
            class="w-full text-[15px] px-3.5 py-2.5 border border-[#d9d3c2] rounded-lg bg-white focus:outline-none focus:ring-2"
          />
        </div>

        <div class="mb-5">
          <label for="description" class="block text-[13px] font-semibold mb-1.5"
            >Description
          </label>
          <textarea
            id="description"
            rows="4"
            [formField]="productForm.description"
            class="w-full text-[15px] px-3.5 py-2.5 border border-[#d9d3c2] rounded-lg bg-white resize-y focus:outline-none focus:ring-2"
          ></textarea>
        </div>

        <div class="mb-5" data-field="type">
          <label for="type" class="block text-[13px] font-semibold mb-1.5">Category </label>
          <select
            id="type"
            [formField]="productForm.typeCode"
            class="w-full text-[15px] px-3.5 py-2.5 border border-[#d9d3c2] rounded-lg bg-white focus:outline-none focus:ring-2"
          >
            <option value="" disabled>Select a category</option>
            @for (category of categories(); track category.code) {
              <option [value]="category.code">{{ category.title }}</option>
            }
          </select>
        </div>

        <div class="flex gap-4 mb-5">
          <div class="flex-1" data-field="price">
            <label for="price" class="block text-[13px] font-semibold mb-1.5">Price </label>
            <input
              type="number"
              id="price"
              step="0.01"
              placeholder="0.00"
              [formField]="productForm.price"
              class="w-full text-[15px] px-3.5 py-2.5 border border-[#d9d3c2] rounded-lg bg-white focus:outline-none focus:ring-2"
            />
          </div>
          <div class="flex-1" data-field="quantity">
            <label for="quantity" class="block text-[13px] font-semibold mb-1.5">Quantity </label>
            <input
              type="number"
              id="quantity"
              step="1"
              placeholder="0"
              [formField]="productForm.quantity"
              class="w-full text-[15px] px-3.5 py-2.5 border border-[#d9d3c2] rounded-lg bg-white focus:outline-none focus:ring-2"
            />
          </div>
        </div>

        <div class="mb-5">
          <label class="block text-[13px] font-semibold mb-1.5">Main Image </label>
          <image-upload [formField]="productForm.mainImage" />
        </div>

        <div class="mb-5">
          <label class="block text-[13px] font-semibold mb-1.5">Additional Images </label>

          <label
            for="additionalImageUpload"
            class="flex flex-col items-center justify-center w-full h-24 border-2 border-dashed border-accent rounded-xl bg-[#fcffeb] hover:bg-[#faffdc] cursor-pointer transition"
          >
            <span class="text-sm font-medium">Click to upload an image</span>
            <span class="text-xs text-gray-400 mt-1">PNG or JPG up to 10MB</span>
            <input
              id="additionalImageUpload"
              type="file"
              accept="image/*"
              class="hidden"
              (change)="addAdditionalImage($event)"
            />
          </label>

          @if (productModel().additionalImage.length) {
            <div class="flex flex-wrap gap-2 mt-3">
              @for (image of productModel().additionalImage; track $index) {
                <div
                  class="relative flex items-center gap-2 text-[13px] bg-[#f3f1e7] border border-[#d9d3c2] pl-3 pr-1.5 py-1"
                >
                  <img
                    class="h-38 object-contain"
                    [src]="imageUrl(image.name)"
                    alt="addition image"
                  />
                </div>
              }
            </div>
          }
        </div>
      </div>

      <div class="flex justify-end">
        <button
          type="submit"
          [disabled]="productForm().submitting()"
          class="hover:bg-[#333] transition-colors gap-3 flex items-center font-medium bg-black text-white rounded-full px-6 py-3 disabled:opacity-50"
        >
          {{ productForm().submitting() ? 'Uploading…' : 'Upload product' }}
          <span class="flex items-center justify-center bg-white rounded-full size-7">
            <img class="size-5" src="assets/icons/chevron-right.svg" alt="chevron right" />
          </span>
        </button>
      </div>
    </form>
  </div>
} @else {
  <div class="mt-12 px-12 mb-14">
    <h1 class="text-4xl font-semibold mb-6">Please log in to access this page</h1>
  </div>
}
