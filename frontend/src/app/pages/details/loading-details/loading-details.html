<div class="flex gap-4 items-start animate-pulse">
  <div class="flex flex-col gap-3">
    @for (i of [1, 2, 3]; track i) {
      <div class="bg-soft rounded-xl w-25 h-25"></div>
    }
  </div>
  <div class="rounded-3xl bg-soft w-[40vw] mr-6 aspect-square"></div>
  <div class="flex flex-col pt-2 gap-4 w-lg">
    <div class="h-7 w-24 rounded-full bg-soft"></div>

    <div class="flex flex-col gap-2 mt-1">
      <div class="h-10 w-full rounded-lg bg-soft"></div>
      <div class="h-10 w-20 rounded-lg bg-soft"></div>
    </div>

    <div class="flex flex-col gap-2 mt-2">
      <div class="h-4 w-full rounded bg-soft"></div>
      <div class="h-4 w-full rounded bg-soft"></div>
      <div class="h-4 w-5/6 rounded bg-soft"></div>
      <div class="h-4 w-2/3 rounded bg-soft"></div>
    </div>

    <div class="flex items-center gap-4">
      <div class="h-11 w-32 rounded-full bg-soft"></div>
      <div class="h-11 flex-1 rounded-full bg-soft"></div>
    </div>
  </div>
</div>
