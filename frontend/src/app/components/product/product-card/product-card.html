<a
  [routerLink]="'/details/'.concat(product().slug)"
  class="flex flex-col items-center cursor-pointer"
>
  <div class="group flex items-center justify-center p-6 bg-soft size-64 rounded-2xl">
    <img
      class="w-full h-full object-contain group-hover:scale-105 transition-all"
      [src]="url()"
      alt="product"
    />
  </div>
  <h1 class="text-lg font-medium mt-2">{{ product().name }}</h1>
  <p class="font-semibold text-primary">{{ product().price }} €</p>
</a>
