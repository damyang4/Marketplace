<div
  class="shadow-xs h-20 sticky bg-white w-full top-0 z-20 flex justify-between items-center py-4 px-12 font-semibold text-[15px]"
>
  <div class="absolute w-0">
    @if (isDropDownOpen()) {
      <dropdown [categories]="categories()" [toggleOpen]="() => toggleOpen()" />
    }
  </div>
  <div class="flex items-center gap-6">
    <a [routerLink]="['/']" class="hover:text-[#333] flex items-center gap-2 cursor-pointer mr-3">
      <img class="size-12" src="assets/images/logo.png" alt="vegetables logo" />
      <p class="text-xl">FarmLink</p>
    </a>
    <a class="hover:text-[#333]" [routerLink]="['/']">Home</a>
    <button (click)="toggleOpen()" class="hover:text-[#333] flex items-center">
      Categories
      <span> <img class="size-5" src="assets/icons/chevron-down.svg" alt="chevron down" /> </span>
    </button>
    <a class="hover:text-[#333]" [routerLink]="['/products']">All products</a>
  </div>
  <div class="flex items-center gap-6">
    <searchbar />
    <!-- USER BUTTON   -->
    <div class="relative">
      <img
        class="size-5 cursor-pointer hover:opacity-80 transition-opacity"
        src="assets/icons/user.svg"
        alt="user icon"
        (click)="toggleUserMenu()"
      />

      @if (isUserMenuOpen()) {
      <div class="fixed inset-0 z-10" (click)="toggleUserMenu()"></div>

      <div class="absolute right-0 mt-3 w-48 bg-white rounded-md shadow-lg border border-gray-100 py-2 z-20 animate-fade-in">
        @if (isLoggedIn()) {
        <a [routerLink]="['/profile']" (click)="toggleUserMenu()" class="block px-4 py-2 text-gray-700 hover:bg-gray-50 transition-colors">
          My Profile
        </a>
        <a [routerLink]="['/orders']" (click)="toggleUserMenu()" class="block px-4 py-2 text-gray-700 hover:bg-gray-50 transition-colors">
          Order History
        </a>
        <hr class="my-1 border-gray-100">
        <button
          (click)="logout()"
          class="w-full text-left block px-4 py-2 text-red-500 hover:bg-red-50 transition-colors font-medium"
        >
          Sign Out
        </button>
        } @else {
        <a
          [routerLink]="['/login']"
          [queryParams]="{ tab: 'login' }"
          (click)="toggleUserMenu()"
          class="block px-4 py-2 text-gray-700 hover:bg-gray-50 transition-colors font-medium">
          Sign In
        </a>
        <a
          [routerLink]="['/login']"
          [queryParams]="{ tab: 'register' }"
          (click)="toggleUserMenu()"
          class="block px-4 py-2 text-gray-600 hover:bg-gray-50 transition-colors">
          Create Account
        </a>
        }
      </div>
      }
    </div>
<!--    -->
    <div class="flex">
      <img
        class="size-5 cursor-pointer"
        src="assets/icons/shopping-cart.svg"
        alt="shopping cart icon"
        (click)="toggleCart()"
      />

      <div
        [class.invisible]="cartItemsCount() === 0"
        class="flex justify-center items-center rounded-full bg-red-400 w-4 h-4 relative -top-1 right-2"
      >
        <p class="text-white text-xs ">{{ cartItemsCount() }}</p>
      </div>
    </div>


    @if (isCartOpen()) {
      <div class="fixed inset-0 bg-black/40 z-30" (click)="toggleCart()"></div>
    }

    <div
      class="fixed top-0 right-0 h-full z-40 transition-transform duration-300 ease-out"
      style="transition: transform 300ms ease-out;"
      [style.transform]="isCartOpen() ? 'translateX(0)' : 'translateX(100%)'"
    >
      <cart [close]="() => toggleCart()" />
    </div>
  </div>
</div>
