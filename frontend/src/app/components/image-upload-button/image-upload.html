<div>
  @if (value().name) {
    <div
      class="relative w-full h-38 rounded-xl overflow-hidden border border-[#d9d3c2] flex items-center justify-center px-4"
    >
      <img class="h-38" [src]="imageUrl(value().name)" alt="product main image" />
  
    </div>
  } @else {
    <label
      [for]="inputId"
      class="flex flex-col items-center justify-center w-full h-38 border-2 border-dashed border-accent rounded-xl bg-[#fcffeb] hover:bg-[#faffdc] cursor-pointer transition"
      [class.opacity-60]="uploading()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-8 h-8 mb-3"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 7.5L12 3m0 0L7.5 7.5M12 3v13.5"
        />
      </svg>
      <span class="text-sm font-medium">{{
        uploading() ? 'Uploading…' : 'Click to upload an image'
      }}</span>
      <span class="text-xs text-gray-400 mt-1">PNG or JPG up to 10MB</span>
      <input
        [id]="inputId"
        type="file"
        accept="image/*"
        class="hidden"
        [disabled]="uploading()"
        (change)="onFileSelected($event)"
      />
    </label>
  }
</div>
